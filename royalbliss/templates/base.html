<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ meta_description }}">
<meta name="theme-color" content="#6b1839">
{% set canonical = canonical_url(request.endpoint) if request.endpoint else '' -%}
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ company.name }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ meta_description }}">
<meta property="og:url" content="{{ canonical }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
{% block head_extra %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include "partials/header.html" %}

<main id="main">
{% block content %}{% endblock %}
</main>

{% include "partials/footer.html" %}
<script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
